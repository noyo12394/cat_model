services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: earthpulse
      POSTGRES_USER: earthpulse
      POSTGRES_PASSWORD: earthpulse_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earthpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: local
      CORS_ALLOW_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://earthpulse:earthpulse_dev_only@postgres:5432/earthpulse
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./apps/api
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql://earthpulse:earthpulse_dev_only@postgres:5432/earthpulse
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api/app:/app/app
    command: python -m app.worker

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  postgres_data:
